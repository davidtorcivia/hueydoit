services:
  huey-do-it:
    build: .
    network_mode: host
    restart: unless-stopped
    # Visibility only — plain Compose will not restart an unhealthy container.
    # The in-process watchdog (app/watchdog.py) is what actually recovers a
    # wedged event loop, by exiting so the restart policy takes over.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8585/api/status', timeout=8).status == 200 else 1)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      - HUE_CONTROLLER_PORT=${HUE_CONTROLLER_PORT:-8585}
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - LATITUDE=${LATITUDE:-40.704941}
      - LONGITUDE=${LONGITUDE:--73.914642}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - TZ=${TZ:-America/New_York}
      - HUE_BRIDGE_IP=${HUE_BRIDGE_IP:-}
      - EXTERNAL_OVERRIDE_TIMEOUT_MIN=${EXTERNAL_OVERRIDE_TIMEOUT_MIN:-30}
      - WATCHDOG_STALL_MINUTES=${WATCHDOG_STALL_MINUTES:-20}
      - DB_PATH=data/huey-do-it.db
    volumes:
      - ./data:/app/data
